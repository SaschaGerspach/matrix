<div class="login-wrapper">
  <div class="login-card surface-card">
    <div class="login-brand">
      <span class="brand-mark"><mat-icon>grid_view</mat-icon></span>
      <span class="brand-name">{{ 'APP_NAME' | translate }}</span>
    </div>

    <h1 class="login-title">{{ 'LOGIN.TITLE' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'LOGIN.USERNAME' | translate }}</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'LOGIN.PASSWORD' | translate }}</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (errorMessage(); as msg) {
        <p class="error" data-testid="login-error">{{ msg | translate }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="full-width"
        [disabled]="form.invalid || loading()"
      >
        @if (loading()) {
          <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
        } @else {
          {{ 'LOGIN.SUBMIT' | translate }}
        }
      </button>
    </form>
  </div>
</div>
